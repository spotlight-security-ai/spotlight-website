# Netlify configuration — static site, no build step.
# The whole repo root is published as-is (plain HTML/CSS/JS).

[build]
  publish = "."
  command = ""

# --- Legacy WordPress URLs (trailing-slash paths) → static pages -----------
# Preserves inbound links / SEO from the old WP site so they don't 404.
[[redirects]]
  from = "/platform/"
  to = "/platform.html"
  status = 301

[[redirects]]
  from = "/industries/"
  to = "/industries.html"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/book-a-demo/"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/pricing/"
  to = "/#pricing"
  status = 301

# --- Canonical host: force www → apex --------------------------------------
# Duplicates Netlify's automatic primary-domain redirect; keep whichever you
# prefer. Safe to leave — it only fires once the domain is attached in Netlify.
[[redirects]]
  from = "https://www.spotlightsecurity.ai/*"
  to = "https://spotlightsecurity.ai/:splat"
  status = 301
  force = true

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Optional CSP — TEST on the *.netlify.app URL first (Google Fonts, inline
    # styles/scripts and the Pipedrive web form + LeadBooster chatbot are
    # allow-listed below), then uncomment to enable:
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://webforms.pipedrive.com https://leadbooster-chat.pipedrive.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.pipedrive.com; connect-src 'self' https://*.pipedrive.com wss://*.pipedrive.com; frame-src https://webforms.pipedrive.com https://leadbooster-chat.pipedrive.com; base-uri 'self'; frame-ancestors 'self'"

# --- Dashboard sign-in clips -------------------------------------------------
# dashboard.spotlightsecurity.ai/signin fetches media/dashboard/clips.json from
# this site, so the list needs a CORS header. The clips are public marketing
# footage, so any origin may read them (this also covers the dev dashboard).
[[headers]]
  for = "/media/dashboard/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Verification tokens are consumed in the browser and report content is loaded
# only after API verification. Do not index or cache the report page.
# [[headers]] entries cannot interpolate preview-config.js. If a separate API
# origin is selected, add that exact HTTPS origin to connect-src in both scoped
# policies below as part of the same reviewed deployment change.
[[headers]]
  # The trailing wildcard also covers Netlify Pretty URL variants such as
  # /assessment-preview and /assessment-preview/.
  for = "/assessment-preview*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  # Keep report protections on both the source filename and Pretty URL forms.
  for = "/assessment-report*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
